<footer class="site-footer">
  <span>© {{ now.Year }} {{ site.Title }}</span>
</footer>

<dialog class="lightbox" id="lightbox" aria-label="Image preview">
  <button class="lightbox-close" type="button" aria-label="Close preview">×</button>
  <img class="lightbox-img" alt="">
  <p class="lightbox-hint">Scroll or double-click to zoom · Drag to pan · Esc to close</p>
</dialog>

<script>
  function codeText(code) {
    var lines = code.querySelectorAll('span.line');
    if (!lines.length) return code.textContent;
    return Array.prototype.map.call(lines, function (line) {
      var text = line.textContent;
      var prompt = line.querySelector('.prompt');
      if (prompt) text = text.slice(prompt.textContent.length);
      return text.endsWith('\n') ? text.slice(0, -1) : text;
    }).join('\n');
  }

  document.querySelectorAll('.codeblock').forEach(function (block) {
    var btn = block.querySelector('.copy-btn');
    var code = block.querySelector('pre code');
    if (!btn || !code) return;
    btn.addEventListener('click', function () {
      navigator.clipboard.writeText(codeText(code)).then(function () {
        btn.classList.add('copied');
        setTimeout(function () { btn.classList.remove('copied'); }, 1500);
      });
    });
  });
</script>

<script>
  (function () {
    var dlg = document.getElementById('lightbox');
    if (!dlg || typeof dlg.showModal !== 'function') return;

    var view = dlg.querySelector('.lightbox-img');
    var scale = 1, tx = 0, ty = 0, drag = null, startX = 0, startY = 0;

    function render() {
      view.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
      dlg.classList.toggle('is-zoomed', scale > 1);
    }

    function reset() {
      scale = 1; tx = 0; ty = 0; render();
    }

    function zoomTo(next) {
      scale = Math.min(6, Math.max(1, next));
      if (scale === 1) { tx = 0; ty = 0; }
      render();
    }

    document.addEventListener('click', function (e) {
      var link = e.target.closest('a.zoom-link');
      if (!link) return;
      e.preventDefault();
      var thumb = link.querySelector('img');
      view.src = link.getAttribute('href');
      view.alt = thumb ? thumb.alt : '';
      reset();
      document.body.style.overflow = 'hidden';
      dlg.showModal();
    });

    dlg.addEventListener('click', function (e) {
      if (e.target === dlg) dlg.close();
    });

    dlg.querySelector('.lightbox-close').addEventListener('click', function () {
      dlg.close();
    });

    dlg.addEventListener('close', function () {
      document.body.style.overflow = '';
      reset();
    });

    dlg.addEventListener('wheel', function (e) {
      e.preventDefault();
      zoomTo(scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15));
    }, { passive: false });

    view.addEventListener('dblclick', function () {
      zoomTo(scale > 1 ? 1 : 2.5);
    });

    view.addEventListener('pointerdown', function (e) {
      if (scale <= 1) return;
      drag = e.pointerId;
      startX = e.clientX - tx;
      startY = e.clientY - ty;
      view.setPointerCapture(e.pointerId);
    });

    view.addEventListener('pointermove', function (e) {
      if (drag !== e.pointerId) return;
      tx = e.clientX - startX;
      ty = e.clientY - startY;
      render();
    });

    view.addEventListener('pointerup', function (e) {
      if (drag === e.pointerId) drag = null;
    });
  })();
</script>
